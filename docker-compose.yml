name: medicareguard-soc

services:
  postgres:
    image: postgres:16-alpine
    container_name: mg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicare}
      POSTGRES_DB: ${POSTGRES_DB:-medicareguard}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicare} -d ${POSTGRES_DB:-medicareguard}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [socnet]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mg-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicare}:${POSTGRES_PASSWORD:-medicare}@postgres:5432/${POSTGRES_DB:-medicareguard}
      DATABASE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-medicareguard-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      SEED_ON_START: ${SEED_ON_START:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      N8N_BASE_URL: http://n8n:5678
      N8N_AI_CHAT_URL: http://n8n:5678/webhook/mg-ai-chat
      N8N_AI_CHAT_TIMEOUT_MS: ${N8N_AI_CHAT_TIMEOUT_MS:-15000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [socnet]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MedicareGuard SOC}
    container_name: mg-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_MAILPIT_URL: ${NEXT_PUBLIC_MAILPIT_URL:-http://localhost:8025}
      BACKEND_INTERNAL_URL: http://backend:4000
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [socnet]

  n8n:
    image: n8nio/n8n:2.41.5
    container_name: mg-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-medicareguard}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key-2026}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-medicareguard}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-medicare}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-medicare}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      MG_API_URL: http://backend:4000/api
      MG_API_TOKEN: ${MG_API_TOKEN:-}
      MG_CONSOLE_URL: ${MG_CONSOLE_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MG_ALERT_EMAIL: ${MG_ALERT_EMAIL:-}
      MG_SMTP_FROM: ${MG_SMTP_FROM:-}
      MG_SMTP_HOST: ${MG_SMTP_HOST:-}
      MG_SMTP_USER: ${MG_SMTP_USER:-}
      MG_SMTP_PASSWORD: ${MG_SMTP_PASSWORD:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [socnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: mg-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - n8n
    networks: [socnet]

volumes:
  pgdata:
  n8n_data:

networks:
  socnet:
    driver: bridge
