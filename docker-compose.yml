name: medicareguard-soc

services:
  postgres:
    image: postgres:17-alpine
    container_name: mg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: medicare
      POSTGRES_DB: medicareguard
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare -d medicareguard"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [socnet]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mg-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PORT: 4000
      DATABASE_URL: postgresql://medicare:medicare@postgres:5432/medicareguard
      DATABASE_SSL: "false"
      CORS_ORIGINS: "https://cham164.id.vn,http://localhost:3000,http://localhost:8080"
      JWT_SECRET: change-me-in-production-medicareguard-2026
      JWT_EXPIRES_IN: 12h
      BCRYPT_ROUNDS: 10
      SEED_ON_START: "true"
      N8N_BASE_URL: http://n8n:5678
      N8N_AI_CHAT_URL: http://n8n:5678/webhook/mg-ai-chat
      N8N_AI_CHAT_TIMEOUT_MS: 15000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_started
    networks: [socnet]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://cham164.id.vn/api
        NEXT_PUBLIC_APP_NAME: MedicareGuard SOC
    container_name: mg-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://cham164.id.vn/api
      NEXT_PUBLIC_MAILPIT_URL: https://cham164.id.vn/mailpit
      BACKEND_INTERNAL_URL: http://backend:4000
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks: [socnet]

  n8n:
    image: n8nio/n8n:2.41.5
    container_name: mg-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.cham164.id.vn
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_EDITOR_BASE_URL: https://n8n.cham164.id.vn/
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: medicareguard
      N8N_ENCRYPTION_KEY: change-me-n8n-encryption-key-2026
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      WEBHOOK_URL: https://n8n.cham164.id.vn/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: medicareguard
      DB_POSTGRESDB_USER: medicare
      DB_POSTGRESDB_PASSWORD: medicare
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_started
    networks: [socnet]

volumes:
  pgdata:
  n8n_data:

networks:
  socnet:
    driver: bridge
